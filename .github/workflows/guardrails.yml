name: guardrails-stop-94-25
on:
  push:
    branches: [main, master, concierge-turnos]
  pull_request:
    branches: [main, master, chore/ci-cd-break-before-prod, chore/guardrails-stop-94-25]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guardrails:
    name: guardrails 3 camadas / sanitizacao + limites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/guardrails-check.mjs --gate=guardrails
  injection:
    name: injection 30+ PT-BR/EN bloqueio determinístico
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/guardrails-check.mjs --gate=injection
  quality:
    name: qualidade golden >=95%
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/guardrails-check.mjs --gate=quality
  cost:
    name: cost SLM <25%
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/guardrails-check.mjs --gate=cost
  break-gate:
    name: break before prod (merge/deploy so se verde)
    runs-on: ubuntu-latest
    needs: [guardrails, injection, quality, cost]
    steps:
      - run: echo 'GATES VERDES - merge liberado, deploy liberado com poll ate SUCCESS'
